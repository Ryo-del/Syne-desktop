name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-build.yml"
      - "src/**"
      - "src-tauri/**"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "go.mod"
      - "go.sum"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh release create в шаге Publish release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Проверки до сборки: ошибка в сервисе или интерфейсе не должна доехать до установщика.
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Type check
        run: npx tsc --noEmit

      # Версия установщика берётся из тега релиза (v0.1.0 -> 0.1.0).
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = [regex]::Match($env:GITHUB_REF_NAME, '^v(\d+\.\d+\.\d+)')
          if (-not $match.Success) {
            Write-Error "tag $env:GITHUB_REF_NAME does not look like vX.Y.Z"
            exit 1
          }
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $match.Groups[1].Value
          $conf | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8

      # Сборка: интерфейс, локальный сервис (sidecar) для Windows и установщик NSIS (.exe).
      - name: Build Tauri Windows bundle
        env:
          SIDECAR_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      # Тестовые сборки из main храним недолго: иначе кончается квота
      # хранилища артефактов GitHub Actions.
      - name: Upload Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: syne-desktop-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3

      # Релиз публикуется прямо из сборки, без промежуточного артефакта.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then echo "no installer found" >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes --verify-tag
